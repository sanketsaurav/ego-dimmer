<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Ego Dimmer</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main class="panel">
      <header class="header">
        <img
          class="brand-mark"
          src="icons/icon128.png"
          width="30"
          height="30"
          alt=""
        />
        <h1>Ego Dimmer</h1>
      </header>

      <section class="site-card" id="site-card">
        <p class="hostname" id="active-hostname">Current site</p>

        <div class="site-control">
          <div class="site-copy">
            <h2 id="site-title">HDR dimming is off</h2>
            <p id="site-description">Media keeps its original brightness.</p>
          </div>

          <button
            class="site-toggle"
            id="site-toggle"
            type="button"
            role="switch"
            aria-checked="false"
            aria-label="Turn HDR dimming on for this site"
          >
            <span class="site-toggle__track" aria-hidden="true">
              <span class="site-toggle__thumb"></span>
            </span>
          </button>
        </div>
      </section>

      <section class="intensity" id="intensity" hidden>
        <div class="intensity-copy">
          <h2>Intensity</h2>
          <p>How much HDR headroom should remain?</p>
        </div>

        <fieldset class="mode-selector">
          <legend class="sr-only">Dimming intensity</legend>
          <label class="mode-option">
            <input type="radio" name="mode" value="standard" checked />
            <span class="mode-option__control">
              <span class="mode-option__title">Full SDR</span>
              <span class="mode-option__note">No extra brightness</span>
            </span>
          </label>
          <label class="mode-option">
            <input type="radio" name="mode" value="constrained" />
            <span class="mode-option__control">
              <span class="mode-option__title">Gentle</span>
              <span class="mode-option__note">Keep a little glow</span>
            </span>
          </label>
        </fieldset>

        <p class="notice" id="notice" role="status" aria-live="polite"></p>
      </section>

      <div class="meta">
        <footer>
          <p>
            Works locally. No tracking.
            <a
              href="https://github.com/sanketsaurav/ego-dimmer"
              target="_blank"
              rel="noopener noreferrer"
              >Open-source</a
            >.
          </p>
          <p>
            An experiment by
            <a
              href="https://sanketsaurav.com"
              target="_blank"
              rel="noopener noreferrer"
              >Sanket Saurav</a
            >.
          </p>
        </footer>
      </div>
    </main>

    <script src="popup.js"></script>
  </body>
</html>
